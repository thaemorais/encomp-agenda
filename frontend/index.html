<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Encomp</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <h1>Agenda Encomp</h1>
      <p id="msg"></p>

      <form id="form">
        <input type="hidden" name="eventoId" id="eventoId" />
        <label>Título <input name="titulo" id="titulo" required /></label>
        <label>Data <input name="data" id="data" type="date" required /></label>
        <label>Local <input name="local" id="local" required /></label>
        <label>
          Status
          <select name="status" id="status">
            <option value="agendado">Agendado</option>
            <option value="em_andamento">Em andamento</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </label>
        <button type="submit">Salvar</button>
      </form>

      <h2>Eventos</h2>
      <ul id="lista"></ul>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
